name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: End-to-end run on the bundled sample data
        run: PYTHONPATH=src python -m ttc_pipeline.cli run --sample
  dag:
    name: Airflow DAG imports cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: DAG tests (the import test must run, not skip)
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          pytest tests/test_dag.py -q -rs | tee dag.txt
          ! grep -qi skipped dag.txt
